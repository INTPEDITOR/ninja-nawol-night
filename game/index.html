<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/app-icon.ico" sizes="any"><title>수련해라! 닌자 나월!</title><style>*{box-sizing:border-box}body{margin:0;background:#14121a;color:#fff;height:100dvh;overflow:hidden;font-family:system-ui}.cover{position:relative;width:100%;height:100%;background:url('assets/main-hero-v2.png') center/cover no-repeat}.character{position:absolute;right:1%;bottom:0;height:94%;max-width:47%;object-fit:contain;object-position:bottom}.start{position:absolute;left:12%;bottom:13%;background:#ead6ac;color:#251d21;border:1px solid #fff0c9;border-radius:3px;padding:18px 60px;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 8px 30px #0008}.start:hover{background:#fff0c9}.note{position:absolute;left:12%;bottom:7%;color:#d8c7ad;font-size:12px}@media(max-width:700px){.cover{background-position:38% center}.character{max-width:58%;right:-10%;height:80%}.start{left:7%;padding:14px 30px}.note{left:7%;font-size:10px}}body{display:grid;place-items:center;background:#060c17}.cover{width:min(100vw,177.7777778vh);height:min(100dvh,56.25vw);aspect-ratio:16/9}@keyframes enter{from{opacity:0}to{opacity:1}}.cover{animation:enter .35s ease-out}.start{transition:background .15s,transform .15s}.start:hover{transform:translateY(-2px)}@media(prefers-reduced-motion:reduce){.cover{animation:none}.start{transition:none}}.start{left:29.3%;bottom:22%;width:clamp(170px,28vw,420px);height:auto;aspect-ratio:2143/416;padding:0;border:0;background:transparent;border-radius:8px;overflow:hidden;box-shadow:none;transform:translateX(-50%)}.start img{position:absolute;left:-.7%;top:-31.97%;width:101.35%;height:auto;pointer-events:none;display:block}.start:hover{background:transparent;transform:translateX(-50%) translateY(-2px);filter:brightness(1.12)}.start:focus-visible{outline:2px solid #ead7a8;outline-offset:5px}@media(max-width:700px){.start{left:29.3%;padding:0;width:28vw;min-width:100px}} </style><body><main class="cover" aria-label="수련해라! 닌자 나월! 메인화면"><img class="character" src="assets/ninja.png" alt="원본 닌자 나월 캐릭터"><button class="start" id="launch" aria-label="게임 시작"><img src="assets/start-button.png" alt=""></button></main><script>document.getElementById('launch').onclick=()=>{window.NawolMenuMusic?.stop();if(window.chrome?.webview){const cover=document.querySelector('.cover');cover.style.transition='opacity .16s ease-out';cover.style.opacity='0';setTimeout(()=>location.href='play.html',160);return;}const [width,height]=(window.NawolSettings?.resolution||'1920x1080').split('x').map(Number);const left=Math.max(0,(screen.availWidth-width)/2),top=Math.max(0,(screen.availHeight-height)/2);const game=window.open('play.html?stages=1','NawolGame','popup=yes,width='+width+',height='+height+',left='+left+',top='+top+',resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no');if(game)game.focus();else location.href='play.html';}</script><script src="settings.js"></script></body></html>
